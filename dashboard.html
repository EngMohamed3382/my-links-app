<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>أهلاً بك في لوحة التحكم</h1>
            <p>من هنا يمكنك إدارة روابط صفحتك.</p>
            <button id="logout-btn">تسجيل الخروج</button>
        </header>
        
        <main>
            <form id="add-link-form">
                <h3>إضافة رابط جديد</h3>
                <input type="text" id="link-title" placeholder="عنوان الرابط (مثلاً: صفحتي على فيسبوك)" required>
                <input type="url" id="link-url" placeholder="الرابط الكامل (مثلاً: https://facebook.com/username)" required>
                <button type="submit">إضافة الرابط</button>
            </form>

            <div class="links-section">
                <h2>روابطي الحالية:</h2>
                <div id="links-list">
                    <p>جاري تحميل الروابط...</p>
                </div>
            </div>
            <div class="profile-section">
                    <h3>إعدادات الملف الشخصي</h3>
                    <form id="profile-form">
                        <input type="text" id="username" placeholder="اسم المستخدم (باللغة الإنجليزية وبدون مسافات)" required>
                        <textarea id="bio" placeholder="نبذة قصيرة عنك"></textarea>
                        <button type="submit">حفظ التغييرات</button>
                    </form>
            </div>
            <hr>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
</body>
</html>
