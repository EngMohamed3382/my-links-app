<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="#" class="logo">لوحة التحكم</a>
            <button id="logout-btn">تسجيل الخروج</button>
        </div>
    </header>

    <main class="dashboard-content">
        <div class="container">
            <div class="card">
                <h2>رابط صفحتك العامة</h2>
                <p>هذا هو الرابط الذي يمكنك مشاركته مع جمهورك. انسخه وضعه في حساباتك على السوشيال ميديا.</p>
                <div class="share-link-container">
                    <input type="text" id="shareable-link" value="جاري التحميل..." readonly>
                    <button id="copy-link-btn">نسخ</button>
                </div>
            </div>
            <div class="card">
                <h2>إعدادات الملف الشخصي</h2>
                <div class="profile-section">
                    <div class="avatar-upload-container">
                        <img src="placeholder.png" alt="الصورة الشخصية" id="avatar-preview" class="avatar-preview">
                        <input type="file" id="avatar-input" accept="image/png, image/jpeg" style="display: none;">
                        <label for="avatar-input" class="button-like-label">اختر صورة</label>
                        <button id="upload-btn" style="display: none;">رفع وحفظ</button>
                        <p id="upload-status"></p>
                    </div>
                    <form id="profile-form">
                        <input type="text" id="username" placeholder="اسم المستخدم (باللغة الإنجليزية وبدون مسافات)" required>
                        <textarea id="bio" placeholder="نبذة قصيرة عنك"></textarea>
                        <button type="submit">حفظ التغييرات</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <h2>إضافة رابط جديد</h2>
                <form id="add-link-form">
                    <input type="text" id="link-title" placeholder="عنوان الرابط (مثلاً: صفحتي على فيسبوك)" required>
                    <input type="url" id="link-url" placeholder="الرابط الكامل (مثلاً: https://facebook.com/username)" required>
                    <button type="submit">إضافة الرابط</button>
                </form>
            </div>

            <div class="card">
                <h2>روابطي الحالية</h2>
                <div id="links-list">
                    </div>
            </div>

        </div>
    </main>
  <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>تعديل الرابط</h2>
            <form id="edit-link-form">
                <input type="hidden" id="edit-link-id">
                <div class="input-group">
                    <label for="edit-link-title">عنوان الرابط</label>
                    <input type="text" id="edit-link-title" required>
                </div>
                <div class="input-group">
                    <label for="edit-link-url">الرابط الكامل</label>
                    <input type="url" id="edit-link-url" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-edit-btn">إلغاء</button>
                    <button type="submit">حفظ التغييرات</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
</body>
</html>
