<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 id="auth-title">تسجيل الدخول</h1>
            <p id="auth-subtitle">أهلاً بعودتك! أدخل بياناتك للمتابعة.</p>
            
            <form id="auth-form">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required>
                </div>
                
                <div class="input-group hidden" id="confirm-password-group">
                    <label for="confirm-password">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm-password">
                </div>
                
                <button type="submit" id="auth-btn">تسجيل الدخول</button>
            </form>
            
            <p id="message" class="message"></p>
            <div class="forgot-password-container">
    <a href="#" id="forgot-password-link">هل نسيت كلمة المرور؟</a>
</div>
            <p class="toggle-text" id="toggle-auth">
                ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="auth.js"></script>
</body>

</html>
